<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>HabitSense is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f7f5; color: #292d32; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { margin-bottom: .5rem; font-size: 1.5rem; }
      p { color: #5f6670; line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .6rem; background: #343a40; color: white; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { background: #17191c; color: #f3f4f6; } p { color: #c1c6cc; } a { background: #f3f4f6; color: #202327; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>HabitSense will reconnect when your network is available. Previously opened pages and locally saved data may still be available.</p>
      <a href="/">Return to HabitSense</a>
    </main>
  </body>
</html>
